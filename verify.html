<!DOCTYPE html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ID Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
  /*
   * Design tokens shared by every page. --ink is the dark blue the owner chose, and every other
   * blue is a shade of it. --control and --gold are the exact red and yellow of the PSA logo.
   * Colors are hex because the PDF library cannot read newer color formats.
   * Motion values follow the transitions.dev scale.
   */
  :root {
    --ink: #0f2747;
    --ink-raised: #1b3a66;
    --on-ink-soft: #dbe4f0;
    --paper: #e8eef6;
    --paper-line: #dae3ef;
    --strip-light: #b4c4da;
    --surface: #ffffff;
    --surface-tint: #f3f6fa;
    --surface-sunken: #dae3ef;
    --text: #0b1c33;
    --text-muted: #44566f;
    --line: #dae3ef;
    --line-strong: #9fb1ca;
    --accent-soft: #e8eef6;
    --control: #ce1126;
    --gold: #fcd116;
    --warn: #584908;
    --warn-soft: #fef4c5;
    --danger: #ce1126;
    --danger-hover: #a50e1e;
    --danger-soft: #fae7e9;

    --font-ui: 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-data: 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace;

    --radius-control: 3px;
    --radius-surface: 3px;
    --paper-hatch: repeating-linear-gradient(115deg, var(--paper-line) 0 1px, transparent 1px 7px), repeating-linear-gradient(65deg, var(--paper-line) 0 1px, transparent 1px 7px);
    --bar-lines: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22160%22%20height%3D%2264%22%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22%231b3a66%22%20d%3D%22M0%204Q20%20-1%2040%204T80%204T120%204T160%204M0%2012Q20%207%2040%2012T80%2012T120%2012T160%2012M0%2020Q20%2015%2040%2020T80%2020T120%2020T160%2020M0%2028Q20%2023%2040%2028T80%2028T120%2028T160%2028M0%2036Q20%2031%2040%2036T80%2036T120%2036T160%2036M0%2044Q20%2039%2040%2044T80%2044T120%2044T160%2044M0%2052Q20%2047%2040%2052T80%2052T120%2052T160%2052M0%2060Q20%2055%2040%2060T80%2060T120%2060T160%2060%22%2F%3E%3C%2Fsvg%3E");
    --select-chevron: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%230f2747%22%20stroke-width%3D%222.25%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E");
    --shadow-raised: 0 10px 28px -8px rgba(15, 39, 71, 0.34);

    --duration-micro: 80ms;
    --duration-quick: 150ms;
    --duration-fast: 250ms;
    --duration-medium: 350ms;
    --duration-slow: 400ms;
    --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-bounce: cubic-bezier(0.34, 1.36, 0.64, 1);

    --check-opacity-dur: 500ms;
    --check-rotate-dur: 500ms;
    --check-rotate-from: 80deg;
    --check-bob-dur: 500ms;
    --check-y-amount: 12px;
    --check-blur-dur: 500ms;
    --check-blur-from: 8px;
    --check-path-dur: 500ms;
    --check-path-delay: 80ms;
    --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
    --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
    --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
    --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 15px;
  }
  body {
    font-family: var(--font-ui);
    color: var(--text);
    line-height: 1.45;
    background-color: var(--paper);
    background-image: var(--paper-hatch);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
  p { text-wrap: pretty; }
  img { display: block; }

  ::selection { background: var(--ink); color: #ffffff; }
  input { caret-color: var(--ink); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input[type="checkbox"] { accent-color: var(--ink); }

  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* The fine ruled strip under the blue bar, like the edge of security paper. */
  .fine-strip { flex-shrink: 0; height: 12px; background: repeating-linear-gradient(90deg, var(--ink) 0 1px, var(--strip-light) 1px 4px); }

  .brand-seal { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 42px; height: 42px; background: #ffffff; border-radius: 50%; }
  .brand-seal img { width: 36px; height: auto; }
  .brand-text strong { display: block; font-size: 18px; font-weight: 800; line-height: 1.15; color: #ffffff; }
  .brand-text small { display: block; font-size: 12.5px; font-weight: 500; line-height: 1.25; color: var(--on-ink-soft); }

  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success check, from transitions.dev. The path length of the check below is 36. */
  .t-success-check {
    display: inline-block;
    transform-origin: center;
    opacity: 0;
    will-change: transform, opacity, filter;
  }
  .t-success-check svg { display: block; overflow: visible; }
  .t-success-check svg path {
    stroke-dasharray: 36;
    stroke-dashoffset: 36;
  }
  .t-success-check[data-state="in"] {
    animation:
      t-check-fade   var(--check-opacity-dur) var(--check-ease-opacity) forwards,
      t-check-rotate var(--check-rotate-dur)  var(--check-ease-rotate)  forwards,
      t-check-blur   var(--check-blur-dur)    var(--check-ease-out)     forwards,
      t-check-bob    var(--check-bob-dur)     var(--check-ease-bob)     forwards;
  }
  .t-success-check[data-state="in"] svg path {
    animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
  }
  @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes t-check-rotate {
    from { transform: rotate(var(--check-rotate-from)); }
    to   { transform: rotate(0deg); }
  }
  @keyframes t-check-blur {
    from { filter: blur(var(--check-blur-from)); }
    to   { filter: blur(0); }
  }
  @keyframes t-check-bob {
    from { translate: 0 var(--check-y-amount); }
    to   { translate: 0 0; }
  }
  @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

  @media (max-width: 760px) {
    html { font-size: 16px; }
    .fine-strip { height: 8px; }
    .brand-seal { width: 38px; height: 38px; }
    .brand-seal img { width: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .t-success-check { animation: none !important; opacity: 1; }
    .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
  }
</style>

  <style>
    body { min-height: 100vh; min-height: 100dvh; }
    .verify-bar { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 8px 16px; background-color: var(--ink); background-image: var(--bar-lines); }
    .verify-page { display: flex; justify-content: center; padding: 18px 12px 32px; }
    .verify-sheet { width: 100%; max-width: 440px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-surface); }

    .verdict { position: relative; padding: 24px 16px 28px; text-align: center; }
    .verdict::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 4px); opacity: 0.6; }
    .verdict-word { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 48px; font-weight: 800; line-height: 1.05; letter-spacing: 0.01em; }
    .verdict-word .icon { width: 40px; height: 40px; stroke-width: 2.25; }
    .verdict .t-success-check svg { width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .verdict-note { margin-top: 6px; font-size: 16px; font-weight: 600; }
    .verdict-VALID { background: var(--ink); color: #ffffff; }
    .verdict-EXPIRED, .verdict-LOST { background: var(--control); color: #ffffff; }
    .verdict-REVOKED { background: var(--gold); color: var(--text); }

    .person { display: flex; align-items: center; gap: 16px; padding: 20px; border-bottom: 1px solid var(--line-strong); }
    .person-photo { width: 100px; height: 100px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surface-sunken); color: var(--ink); border-radius: 3px; overflow: hidden; outline: 1px solid rgba(0, 0, 0, 0.1); outline-offset: -1px; }
    .person-photo img { width: 100%; height: 100%; object-fit: cover; }
    .person-photo .icon { width: 36px; height: 36px; }
    .person h1 { font-size: 20px; font-weight: 800; color: var(--ink); overflow-wrap: anywhere; }
    .person-position { margin-top: 3px; font-weight: 600; color: var(--text-muted); }
    .person-number { margin-top: 6px; font-family: var(--font-data); font-size: 16px; font-weight: 600; color: var(--control); }

    .facts { padding: 6px 20px 14px; }
    .fact { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .fact:last-child { border-bottom: none; }
    .fact-label { color: var(--text-muted); }
    .fact-value { font-weight: 600; overflow-wrap: anywhere; }

    @media (max-width: 359px) {
      .verdict-word { font-size: 38px; }
      .verdict-word .icon { width: 32px; height: 32px; }
    }

    .message-screen { padding: 56px 24px; text-align: center; color: var(--ink); font-weight: 600; }
    .message-screen .icon { display: block; width: 34px; height: 34px; margin: 0 auto 14px; }
    .message-screen.is-error { color: var(--danger); }
  </style>
<script>
  /* Stands in for google.script.run, which only exists on pages served by Apps Script. */
  (() => {
    const API_URL = "https://script.google.com/macros/s/AKfycbyX2bhIOviFAZ3jpqFYmYDAjG1rjmjXvXj7Q2vcoFy3poZ6DtSyiaWBj3GkxIcEoa_Asw/exec";

    async function callApi(fn, args) {
      const response = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn, args })
      });
      const reply = await response.json();
      if (!reply.ok) throw new Error(reply.message);
      return reply.result;
    }

    function makeRunner(onSuccess, onFailure) {
      return new Proxy({}, {
        get(_, name) {
          if (name === 'withSuccessHandler') return (handler) => makeRunner(handler, onFailure);
          if (name === 'withFailureHandler') return (handler) => makeRunner(onSuccess, handler);
          return (...args) => {
            callApi(name, args).then(onSuccess).catch((err) => {
              if (onFailure) onFailure(err);
            });
          };
        }
      });
    }

    window.google = { script: { run: makeRunner() } };
  })();
</script>

  <script>
    const STATUS_ICONS = {
      EXPIRED: 'circle-x',
      LOST: 'circle-x',
      REVOKED: 'triangle-alert'
    };

    function describeStatus(record) {
      const validUntil = escapeHtml(record.validUntil);
      const notes = {
        VALID: `This ID is valid until ${validUntil}.`,
        EXPIRED: `This ID expired on ${validUntil}.`,
        LOST: 'This ID was reported lost.',
        REVOKED: 'This ID has been revoked.'
      };
      return notes[record.status] || '';
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function iconHtml(name) {
      return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    }

    function showError(message) {
      const content = document.getElementById('content');
      content.className = 'message-screen is-error';
      content.innerHTML = `${iconHtml('circle-x')}${escapeHtml(message)}`;
    }

    function renderFact(label, value) {
      return `<div class="fact"><span class="fact-label">${escapeHtml(label)}</span><span class="fact-value">${escapeHtml(value || '-')}</span></div>`;
    }

    function renderVerdictMark(status) {
      if (status === 'VALID') {
        return '<span class="t-success-check" data-state="in" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M12 25l8 8 16-17"/></svg></span>';
      }
      return iconHtml(STATUS_ICONS[status] || 'circle-x');
    }

    function renderRecord(record) {
      const photo = record.photo ? `<img src="${escapeHtml(record.photo)}" alt="ID photo">` : iconHtml('user');
      const fullName = [record.firstName, record.mi ? `${record.mi}.` : '', record.lastName].filter(Boolean).join(' ');

      const content = document.getElementById('content');
      content.className = '';
      content.innerHTML = `
        <div class="verdict verdict-${escapeHtml(record.status)}">
          <div class="verdict-word">${renderVerdictMark(record.status)} ${escapeHtml(record.status)}</div>
          <p class="verdict-note">${describeStatus(record)}</p>
        </div>
        <div class="person">
          <div class="person-photo">${photo}</div>
          <div>
            <h1>${escapeHtml(fullName)}</h1>
            <div class="person-position">${escapeHtml(record.position)}</div>
            <div class="person-number">${escapeHtml(record.idNumber)}</div>
          </div>
        </div>
        <div class="facts">
          ${renderFact('Valid until', record.validUntil)}
          ${renderFact('Date of birth', record.dob)}
          ${renderFact('Address', record.address)}
        </div>`;
    }

    document.getElementById('brandSeal').innerHTML = `<img src="${CARD_LOGOS.psa}" alt="">`;

    const verifyToken = document.body.dataset.token || new URLSearchParams(location.search).get('verify');
    if (!verifyToken) {
      showError('This ID could not be found.');
    } else {
      google.script.run
        .withSuccessHandler((response) => {
          if (response.success) renderRecord(response.record);
          else showError(response.message);
        })
        .withFailureHandler(() => showError('The ID could not be checked. Check your connection, then try again.'))
        .getVerification(verifyToken);
    }
  </script>
</body>
</html>
